name: Actualizar lista

on:
  schedule:
    - cron: "17 9 * * 1"   # cada lunes, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y limpiar la lista de oisd (nsfw small)
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/sjhgvr/oisd/main/domainswild2_nsfw_small.txt -o fuente.txt
          grep -v '^#' fuente.txt | tr -d ' \t\r' | grep -v '^$' | sort -u > nueva.txt
          rm fuente.txt
          lineas=$(wc -l < nueva.txt)
          if [ "$lineas" -lt 5000 ]; then echo "Lista sospechosamente corta ($lineas); no se actualiza."; exit 1; fi
          mv nueva.txt lista-cold-turkey.txt
      - name: Guardar si cambió
        run: |
          if git diff --quiet; then echo "Sin cambios."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista-cold-turkey.txt
          git commit -m "Actualizar lista ($(date -u +%Y-%m-%d))"
          git push
